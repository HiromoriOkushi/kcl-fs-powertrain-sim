# Advanced Lap Time Optimization Configuration

optimization:
  # Numerical integration parameters
  dt: 0.01                    # Integration time step (seconds)
  max_time: 180.0             # Maximum allowed simulation time for a lap (seconds)
  include_thermal: true       # Whether to include thermal effects in dynamics

  # Optimization algorithm settings
  method: 'SLSQP'             # Optimization method ('SLSQP', 'L-BFGS-B', 'TNC')
  max_iterations: 50          # Maximum number of optimization iterations
  tolerance: 1.0e-4           # Convergence tolerance for the optimizer
  num_control_points: 50      # Number of control points for parameterizing racing line/controls

vehicle_dynamics:
  # Tire model parameters (simplified - replace with more detailed model if available)
  tire_model: 'simple'        # 'simple', 'pacejka' (Pacejka not implemented here)
  cornering_stiffness_front: 18000.0  # N/rad (front axle)
  cornering_stiffness_rear: 22000.0   # N/rad (rear axle)
  max_lateral_accel_g: 2.0      # Maximum lateral acceleration constraint (g)
  max_longitudinal_accel_g: 1.5 # Maximum longitudinal acceleration constraint (g)
  max_braking_decel_g: 1.8    # Maximum braking deceleration constraint (g)

  # Powertrain parameters
  rpm_lag: 0.1                # Engine RPM response lag (seconds) - time constant
  shift_time_penalty: 0.05    # Time penalty for each gear shift (seconds)

racing_line:
  # Constraints on racing line position relative to centerline
  # 0 = centerline, -1 = left edge, +1 = right edge
  track_position_limit: 0.95  # Maximum normalized distance from centerline (allows slight edge usage)
  smoothing_factor: 0.1       # Smoothing factor applied to the racing line control points

controls:
  # Constraints on control inputs
  throttle_rate_limit: 10.0   # Max throttle change per second (1/s)
  brake_rate_limit: 15.0      # Max brake change per second (1/s)
  steering_rate_limit: 10.0   # Max steering change per second (rad/s)

visualization:
  enabled: true               # Generate plots after optimization
  sample_rate: 100            # Number of points to sample for visualization plots
  plot_size: [15, 10]         # Figure size (inches)