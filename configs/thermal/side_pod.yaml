# Side Pod Configuration for Formula Student (Example for one side)
# Assumes symmetric configuration unless separate left/right files are used.

# Side Pod Geometry and Type
side_pod:
  type: "STANDARD"              # Options: MINIMAL, STANDARD, UNDERCUT, HIGH_DOWNFORCE, COOLING_FOCUSED, CUSTOM
  length: 0.8                   # m - Overall length of the side pod
  max_width: 0.28               # m - Maximum width
  max_height: 0.32              # m - Maximum height
  inlet_area: 0.035             # m² - Area of the air inlet opening
  outlet_area: 0.04             # m² - Area of the air outlet opening
  floor_clearance: 0.05         # m - Minimum distance from the ground
  radiator_orientation: "VERTICAL" # Options: VERTICAL, ANGLED, HORIZONTAL, SPLIT, CUSTOM
  # Optional custom parameters if type is CUSTOM
  # drag_coefficient: 0.27
  # lift_coefficient: -0.15
  # cooling_efficiency: 0.85
  # weight: 5.0

# Radiator Integration Parameters (describes the radiator within this side pod)
radiator:
  # Reference to the main radiator configuration file or define parameters here
  # Option 1: Reference file (if radiator config is separate)
  # config_file: 'configs/thermal/radiator_sidepod.yaml'

  # Option 2: Define parameters directly (overrides any referenced file)
  type: "SINGLE_CORE_ALUMINUM" # Matches the type in cooling_system.yaml if this is the primary radiator
  core_area: 0.14               # m² - Actual core area of the radiator used in this pod
  core_thickness: 0.036         # m
  fin_density: 16               # fins/inch
  tube_rows: 2
  tilt_angle: 5.0               # degrees - Tilt relative to the orientation plane (e.g., from vertical)
  position_factor: 0.4          # 0-1 (0=front of pod, 0.5=middle, 1=rear of pod)

# Fan Integration Parameters (if a fan is used within this side pod)
fan:
  # Reference to the main fan configuration file or define parameters here
  # Option 1: Reference file
  # config_file: 'configs/thermal/fan_sidepod.yaml'

  # Option 2: Define parameters directly
  type: "VARIABLE_SPEED"        # Matches the type in cooling_system.yaml if applicable
  max_airflow: 0.18             # m³/s - Airflow rating for the fan used in this pod
  diameter: 0.24                # m
```