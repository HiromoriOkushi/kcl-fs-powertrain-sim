# Cooling System Configuration for Formula Student

# Radiator parameters (Example for a typical FS radiator)
radiator:
  type: "SINGLE_CORE_ALUMINUM"  # Options: SINGLE_CORE_ALUMINUM, DOUBLE_CORE_ALUMINUM, SINGLE_CORE_COPPER, CUSTOM
  core_area: 0.16                # m² - Effective core frontal area
  core_thickness: 0.04           # m - Depth of the radiator core
  fin_density: 16                # fins/inch - Higher density improves heat transfer but increases pressure drop
  tube_rows: 2                   # Number of rows of coolant tubes
  max_pressure: 1.5              # bar - Maximum operating pressure
  # Optional custom parameters if type is CUSTOM
  # base_effectiveness: 0.7
  # thermal_conductivity: 205
  # weight: 4.0

# Water pump parameters
water_pump:
  type: "ELECTRIC"               # Options: MECHANICAL, ELECTRIC, CUSTOM
  max_flow_rate: 70.0            # L/min - Maximum flow rate at nominal conditions
  max_pressure: 1.8              # bar - Maximum pressure head generated by the pump
  nominal_speed: 6000.0          # RPM - Speed for nominal performance (electric pumps)
  mechanical_efficiency: 0.75    # Efficiency of converting input power to hydraulic power
  voltage: 12.0                  # V - Nominal operating voltage (electric pumps)
  current_draw_max: 10.0         # A - Maximum current draw (electric pumps)
  # speed_ratio: 1.0             # For MECHANICAL pumps: ratio to engine speed
  # weight: 0.6                  # kg

# Cooling fan parameters (Example for a typical FS fan)
cooling_fan:
  type: "VARIABLE_SPEED"         # Options: SINGLE_SPEED, VARIABLE_SPEED, DUAL_FAN, CUSTOM
  max_airflow: 0.28              # m³/s - Maximum airflow generated by the fan at zero backpressure
  diameter: 0.27                 # m - Fan diameter
  max_power: 90.0                # W - Maximum electrical power consumption
  voltage: 12.0                  # V - Operating voltage
  # num_fans: 1                  # Number of fans (used for DUAL_FAN type)
  # weight: 0.5                  # kg

# Thermostat parameters
thermostat:
  opening_temp: 82.0             # °C - Temperature at which the thermostat starts opening
  full_open_temp: 92.0           # °C - Temperature at which the thermostat is fully open
  bypass_flow_max: 12.0          # L/min - Maximum flow through the bypass circuit when thermostat is closed

# System parameters
system:
  coolant_volume: 2.5            # L - Total coolant volume in the system
  coolant_density: 1050.0        # kg/m³ - Density of the coolant mixture
  coolant_specific_heat: 3900.0  # J/(kg·K) - Specific heat capacity of the coolant
  system_pressure_cap: 1.3       # bar - Pressure cap rating (gauge pressure)