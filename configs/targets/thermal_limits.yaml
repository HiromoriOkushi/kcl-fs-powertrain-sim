# Thermal Limits Configuration for Formula Student Powertrain

# Engine thermal limits
engine:
  optimal_temp_low: 85.0        # Lower bound of optimal engine temperature range (°C)
  optimal_temp_high: 100.0       # Upper bound of optimal engine temperature range (°C)
  warning_temp: 105.0           # Engine warning temperature (°C) - triggers moderate power limit
  critical_temp: 115.0          # Engine critical temperature (°C) - triggers significant power limit
  shutdown_temp: 125.0          # Engine automatic shutdown temperature (°C) - simulation ends

# Coolant system limits
coolant:
  warning_temp: 98.0            # Coolant warning temperature (°C) - fan activation/increase
  critical_temp: 108.0          # Coolant critical temperature (°C) - triggers engine power limit
  boiling_point: 115.0          # Estimated boiling point at system pressure (°C)
  thermostat_open_temp: 82.0    # Temperature when thermostat begins to open (°C)
  thermostat_full_open_temp: 92.0  # Temperature when thermostat is fully open (°C)
  fan_on_temp: 90.0             # Temperature to activate cooling fan(s) (°C) - lower threshold
  fan_max_temp: 95.0            # Temperature for maximum fan speed (°C) - upper threshold

# Oil system limits
oil:
  optimal_temp_low: 90.0        # Lower bound of optimal oil temperature range (°C)
  optimal_temp_high: 115.0       # Upper bound of optimal oil temperature range (°C)
  warning_temp: 125.0           # Oil warning temperature (°C)
  critical_temp: 135.0          # Oil critical temperature (°C) - may trigger power limit
  minimum_op_temp: 60.0         # Minimum temperature for optimal lubrication (°C)

# Control responses to thermal limits
control:
  # Power derating factors when limits are exceeded
  warning_power_limit_factor: 0.90  # Power reduced to 90% at warning temp
  critical_power_limit_factor: 0.70 # Power reduced to 70% at critical temp

  # Enable adaptive thermal management strategies
  adaptive_control: true

  # PID control parameters for variable speed fans/compressors (if used)
  pid:
    kp: 0.15                    # Proportional gain
    ki: 0.02                    # Integral gain
    kd: 0.08                    # Derivative gain
    setpoint_offset: -2.0       # Offset below target temperature for PID setpoint (°C)

# Ambient conditions for thermal simulation
ambient:
  default_temperature: 25.0     # Default ambient temperature (°C)
  max_test_temperature: 45.0    # Maximum ambient temperature for worst-case testing (°C)
  airflow_factor: 1.0           # Global airflow factor for cooling (1.0 = normal) - can be adjusted