# Acceleration Event Configuration for Formula Student

# Event parameters
event:
  distance: 75.0                # Acceleration distance in meters (standard FS)
  max_time: 10.0                # Maximum simulation time in seconds
  surface_friction: 1.2         # Track surface friction coefficient (typical for asphalt)
  time_step: 0.005              # Simulation time step for acceleration events (smaller step recommended)

# Launch control parameters
launch_control:
  enabled: true                 # Whether to use launch control
  initial_rpm: 9500             # Target RPM for launch (adjust based on engine peak torque)
  launch_slip_target: 0.18      # Target wheel slip ratio during launch (0-1)
  launch_duration: 0.6          # Duration of the launch control phase (seconds)
  traction_control: true        # Enable traction control during launch (limits throttle based on slip)
  max_launch_throttle: 0.95     # Throttle limit during launch control

# Shift strategy parameters
shifting:
  strategy: "MAX_ACCELERATION"  # Shift strategy to use (optimized for acceleration)
  shift_rpm_offset: -300        # RPM below redline to trigger upshift (negative means below)
  use_cas_timing: true          # Use CAS system timing for shifts (ignition cut, etc.)

# Target metrics (for comparison/validation)
targets:
  zero_to_sixty_mph: 3.8        # Target 0-60mph time (seconds)
  zero_to_hundred_kph: 3.6      # Target 0-100kph time (seconds)
  event_time: 4.1               # Target 75m acceleration time (seconds)

# Results output
output:
  log_frequency: 200            # Data points per second to log (Hz)
  plot_results: true            # Automatically generate plots
  plot_wheel_slip: true         # Include wheel slip plot
  save_results: true            # Save results to file
  results_filename: "acceleration_run" # Base filename for results (will be timestamped)